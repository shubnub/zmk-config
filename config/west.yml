manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-hsv-module
      url: https://github.com/shubnub/zmk-hsv-module.git
      revision: main
      path: modules/zmk-hsv-module
    - name: nice-view-gem
      url: https://github.com/mike1808/nice-view-gem.git
      revision: main
      path: modules/nice-view-gem
  self:
    path: config
